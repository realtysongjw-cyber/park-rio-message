<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>고객발송 매물 목록</title>
<meta property="og:title" content="파크리오 평형별 매물 목록 (고객발송)" />
<meta property="og:description" content="평형을 선택해서 카카오톡으로 바로 공유할 수 있습니다." />
<meta property="og:image" content="https://realtysongjw-cyber.github.io/park-rio-message/thumbnail.png?v=3" />
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; margin: 0; padding: 20px; background: #f5f6f8; color: #1a1a1a; }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .badge { display: inline-block; background: #7a4a1f; color: #fff; font-size: 12px; padding: 3px 9px; border-radius: 999px; margin-bottom: 10px; }
  .section { background: #fff; border: 1px solid #e2e4e8; border-radius: 12px; padding: 16px; margin-top: 16px; }
  .section h2 { font-size: 16px; margin: 0 0 10px; color: #7a4a1f; }
  pre { white-space: pre; overflow-x: auto; -webkit-overflow-scrolling: touch; background: #f9fafb; border: 1px solid #eee; border-radius: 8px; padding: 12px; font-size: 14px; line-height: 1.8; margin: 10px 0; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }
  button { flex: 1; min-width: 130px; font-size: 14px; font-weight: 600; padding: 11px 14px; border-radius: 8px; border: none; cursor: pointer; line-height: 1.4; }
  .kakaoShareBtn { background: #FEE500; color: #191919; }
  .copyBtn { background: #7a4a1f; color: #fff; }
  .note { font-size: 12px; color: #888; margin-top: 14px; }
  .asOfDate { display: inline-block; font-size: 12px; font-weight: 600; color: #7a4a1f; background: #f3e9dd; border-radius: 999px; padding: 4px 12px; margin-top: 8px; }
  .backLink { display: inline-block; margin-bottom: 12px; font-size: 13px; color: #7a4a1f; text-decoration: none; }
  .backLink:hover { text-decoration: underline; }
  #sections { min-height: 40px; }
</style>
</head>
<body>
  <div class="wrap">
    <span class="badge">실시간 매물 안내</span>
    <h1>파크리오 평형별 매물 목록</h1>
    <p style="font-size:13px;color:#666;margin:4px 0 0;" id="introText">현재 매매 가능한 파크리오 매물 목록입니다. 평형을 선택해 확인하세요.</p>
    <p class="asOfDate" id="asOfDate"></p>
    <div id="sections"><p class="note">최신 매물 목록을 불러오는 중...</p></div>
    <p class="note" id="statusNote"></p>
  </div>

  <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.8.2/kakao.min.js"></script>
  <script>
    Kakao.init('3f031e1a7cab4b798d1e87c5d49e0d74');

    // 이 페이지는 열 때마다 구글시트 최신 내용을 불러오므로, "정보 기준일"은
    // 지금 이 페이지를 보고 있는 시점(한국시간)의 날짜입니다.
    // Intl.DateTimeFormat으로 Asia/Seoul 기준 날짜를 직접 구함 — 보는 사람의 기기 시간대와
    // 무관하게 항상 한국 날짜 기준으로 정확하게 표시됨 (기기 시간대를 기준으로 수동 계산하면
    // 기기가 이미 한국 시간대인 경우 이중으로 더해져 날짜가 하루 밀리는 문제가 있었음).
    // 카카오톡 공유 카드/복사되는 텍스트에도 이 날짜가 그대로 들어가야 하므로 전역에서 재사용.
    function getKSTDateStr() {
      return new Date().toLocaleDateString('ko-KR', {
        timeZone: 'Asia/Seoul', year: 'numeric', month: 'long', day: 'numeric'
      });
    }
    var KST_DATE_STR = getKSTDateStr();
    (function () {
      var el = document.getElementById('asOfDate');
      if (el) el.textContent = '📅 정보 기준일: ' + KST_DATE_STR;
    })();

    var SHEET_ID = '1Gw6Ivd8hajxg8o2UGizKPD-JvMCA74ws8q87jkLpnQ8';
    var TAB_NAME = '고객발송 미리보기';
    var THUMBNAIL_BASE = 'https://realtysongjw-cyber.github.io/park-rio-message/';
    var THUMBNAIL_URL = THUMBNAIL_BASE + 'thumbnail.png?v=3';

    // 평형별로 미리 만들어둔 전용 썸네일이 있으면 그걸 쓰고, 없으면 공용 썸네일로 대체.
    function pickThumbnail(title) {
      if (title.indexOf('16평') !== -1) return THUMBNAIL_BASE + 'thumbnail-16.png?v=2';
      if (title.indexOf('26평') !== -1) return THUMBNAIL_BASE + 'thumbnail-26.png?v=2';
      if (title.indexOf('32') !== -1 || title.indexOf('33') !== -1) return THUMBNAIL_BASE + 'thumbnail-32-33.png?v=2';
      if (title.indexOf('45평') !== -1) return THUMBNAIL_BASE + 'thumbnail-45.png?v=2';
      if (title.indexOf('52평') !== -1) return THUMBNAIL_BASE + 'thumbnail-52.png?v=2';
      return THUMBNAIL_URL;
    }

    // 카카오톡 공유 버튼으로 만든 링크는 이 시간이 지나면 더 이상 열리지 않습니다.
    // (이메일에 있는 원본 허브 링크에는 적용되지 않음 — 그 링크는 항상 열림)
    var EXPIRE_HOURS = 1 / 60; // ⚠️ 테스트용 임시값(1분). 테스트 끝나면 48로 되돌릴 것.

    function parseCSV(text) {
      var rows = [];
      var row = [];
      var field = '';
      var inQuotes = false;
      for (var i = 0; i < text.length; i++) {
        var c = text[i];
        if (inQuotes) {
          if (c === '"') {
            if (text[i + 1] === '"') { field += '"'; i++; }
            else { inQuotes = false; }
          } else {
            field += c;
          }
        } else {
          if (c === '"') { inQuotes = true; }
          else if (c === ',') { row.push(field); field = ''; }
          else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
          else if (c === '\r') { /* skip */ }
          else { field += c; }
        }
      }
      if (field.length || row.length) { row.push(field); rows.push(row); }
      return rows;
    }

    // Collect ALL message blocks (one per 평형), not just the first.
    function findAllMessageBlocks(rows) {
      var found = [];
      var seen = {};
      for (var r = 0; r < rows.length; r++) {
        for (var c = 0; c < rows[r].length; c++) {
          var v = (rows[r][c] || '').trim();
          if (v.indexOf('[') === 0 && v.indexOf('•') !== -1 && !seen[v]) {
            seen[v] = true;
            found.push(v);
          }
        }
      }
      return found;
    }

    // 특이사항이 없어서 시트에서 "... 29억 - " 또는 "... 29억 -  ▶ 담당자..." 처럼
    // 하이픈만 덩그러니 남는 줄 정리. 하이픈 뒤에 실제 내용(예: "금액조정 가능")이
    // 있는 줄은 그대로 둔다.
    function stripDanglingHyphen(text) {
      var cleaned = text.replace(/[ \t]-[ \t]*(없음)?[ \t]*(?=▶)/g, ' ');
      cleaned = cleaned.replace(/[ \t]-[ \t]*(없음)?[ \t]*$/gm, '');
      return cleaned;
    }

    function slugify(title) {
      return title.replace(/[^\w가-힣]+/g, '-');
    }

    function slugFor(msg, idx) {
      var firstLine = msg.split('\n')[0].trim();
      return slugify(firstLine) + '-' + idx;
    }

    function buildSection(msg, idx, allBlocks) {
      var firstLine = msg.split('\n')[0].trim();
      var slug = slugFor(msg, idx);

      var section = document.createElement('div');
      section.className = 'section';
      section.id = slug;

      var h2 = document.createElement('h2');
      h2.textContent = firstLine;
      section.appendChild(h2);

      var btnRow = document.createElement('div');
      btnRow.className = 'btnrow';

      var shareBtn = document.createElement('button');
      shareBtn.className = 'kakaoShareBtn';
      shareBtn.innerHTML = '카카오톡으로<br>공유하기';
      shareBtn.addEventListener('click', function () {
        var base = window.location.href.split('#')[0].split('?')[0];
        var expiresAt = Date.now() + EXPIRE_HOURS * 60 * 60 * 1000;
        var pageUrl = base + '?exp=' + expiresAt + '#' + slug;
        Kakao.Share.sendDefault({
          objectType: 'feed',
          content: {
            title: firstLine,
            description: KST_DATE_STR + ' 기준 · 탭하면 이 평형의 전체 매물 목록만 확인할 수 있습니다.',
            imageUrl: pickThumbnail(firstLine),
            link: { mobileWebUrl: pageUrl, webUrl: pageUrl }
          },
          buttons: [
            { title: '전체 매물 보기', link: { mobileWebUrl: pageUrl, webUrl: pageUrl } }
          ]
        });
      });

      var copyBtn = document.createElement('button');
      copyBtn.className = 'copyBtn';
      copyBtn.textContent = '전체 텍스트 복사';
      copyBtn.addEventListener('click', function () {
        var textWithDate = '📅 기준일: ' + KST_DATE_STR + '\n\n' + msg;
        navigator.clipboard.writeText(textWithDate).then(function () {
          alert('복사되었습니다.');
        }).catch(function () {
          alert('복사에 실패했습니다. 직접 선택해서 복사해주세요.');
        });
      });

      btnRow.appendChild(shareBtn);
      btnRow.appendChild(copyBtn);
      section.appendChild(btnRow);

      var pre = document.createElement('pre');
      pre.textContent = msg;
      section.appendChild(pre);

      return section;
    }

    // singleIdx >= 0 이면 그 평형 하나만 렌더링 (카톡에서 공유 링크를 눌러 들어온 경우).
    // singleIdx < 0 이면 5개 평형 전체를 렌더링 (원본 허브 페이지).
    function renderSections(blocks, singleIdx) {
      var container = document.getElementById('sections');
      container.innerHTML = '';

      if (singleIdx >= 0) {
        container.appendChild(buildSection(blocks[singleIdx], singleIdx, blocks));
        return;
      }

      blocks.forEach(function (msg, idx) {
        container.appendChild(buildSection(msg, idx, blocks));
      });
    }

    // 공유 링크(?exp=...가 붙은 링크)가 만료되었으면 데이터를 불러오지 않고 바로 안내만 표시.
    var expParam = new URLSearchParams(window.location.search).get('exp');
    if (expParam && Date.now() > Number(expParam)) {
      document.getElementById('sections').innerHTML =
        '<p class="note">이 공유 링크는 만료되었습니다. 최신 매물 목록이 필요하시면 다시 공유를 요청해주세요.</p>';
      document.getElementById('statusNote').textContent = '';
    } else {

    var csvUrl = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID +
      '/gviz/tq?tqx=out:csv&sheet=' + encodeURIComponent(TAB_NAME);

    fetch(csvUrl)
      .then(function (res) { if (!res.ok) throw new Error('HTTP ' + res.status); return res.text(); })
      .then(function (csvText) {
        var rows = parseCSV(csvText);
        var blocks = findAllMessageBlocks(rows).map(stripDanglingHyphen);
        if (!blocks.length) throw new Error('메시지 블록을 찾지 못함');

        var hash = window.location.hash ? decodeURIComponent(window.location.hash.slice(1)) : '';
        var singleIdx = -1;
        if (hash) {
          for (var i = 0; i < blocks.length; i++) {
            if (slugFor(blocks[i], i) === hash) { singleIdx = i; break; }
          }
        }

        renderSections(blocks, singleIdx);

        var introEl = document.getElementById('introText');
        if (introEl) {
          introEl.textContent = singleIdx >= 0
            ? '현재 매매 가능한 파크리오 매물 목록입니다.'
            : '현재 매매 가능한 파크리오 매물 목록입니다. 평형을 선택해 확인하세요.';
        }

        document.getElementById('statusNote').textContent = '';
      })
      .catch(function (err) {
        document.getElementById('sections').innerHTML =
          '<p class="note">최신 내용을 불러오지 못했습니다. (' + err.message + ')</p>';
      });

    }
  </script>
</body>
</html>
